<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <title>数十年实战检验</title>
  
  <!-- Background circle -->
  <circle cx="100" cy="75" r="65" fill="#FEF3C7"/>
  
  <!-- Shield/Badge shape -->
  <path d="M100,30 L140,45 L140,80 Q140,110 100,125 Q60,110 60,80 L60,45 Z" 
        fill="white" stroke="#F59E0B" stroke-width="2"/>
  
  <!-- Inner shield -->
  <path d="M100,40 L130,52 L130,78 Q130,100 100,112 Q70,100 70,78 L70,52 Z" 
        fill="#FEF3C7" stroke="none"/>
  
  <!-- Bridge silhouette inside shield -->
  <g stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="75" y1="85" x2="125" y2="85"/>
    <line x1="90" y1="85" x2="90" y2="65"/>
    <line x1="110" y1="85" x2="110" y2="65"/>
    <line x1="90" y1="68" x2="80" y2="82"/>
    <line x1="90" y1="68" x2="100" y2="82"/>
    <line x1="110" y1="68" x2="100" y2="82"/>
    <line x1="110" y1="68" x2="120" y2="82"/>
  </g>
  
  <!-- Checkmark at top -->
  <circle cx="100" cy="52" r="8" fill="#F59E0B"/>
  <polyline points="96,52 99,55 105,49" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Years text -->
  <text x="100" y="102" font-family="Arial, sans-serif" font-size="10" fill="#D97706" text-anchor="middle" font-weight="bold">30+</text>
</svg>
