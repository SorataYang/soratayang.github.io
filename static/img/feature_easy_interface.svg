<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <title>零成本快速上手</title>
  
  <!-- Background circle -->
  <circle cx="100" cy="75" r="65" fill="#ECFDF5"/>
  
  <!-- Window frame -->
  <rect x="45" y="35" width="110" height="80" rx="6" fill="white" stroke="#10B981" stroke-width="2"/>
  
  <!-- Title bar -->
  <rect x="45" y="35" width="110" height="16" rx="6" fill="#10B981"/>
  <rect x="45" y="45" width="110" height="6" fill="#10B981"/>
  
  <!-- Window controls -->
  <circle cx="55" cy="43" r="3" fill="white" opacity="0.8"/>
  <circle cx="65" cy="43" r="3" fill="white" opacity="0.8"/>
  <circle cx="75" cy="43" r="3" fill="white" opacity="0.8"/>
  
  <!-- Content area - simple bridge wireframe -->
  <g stroke="#10B981" stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- Simple bridge outline -->
    <line x1="60" y1="95" x2="140" y2="95"/>
    <line x1="80" y1="95" x2="80" y2="70"/>
    <line x1="120" y1="95" x2="120" y2="70"/>
    <line x1="80" y1="75" x2="65" y2="92"/>
    <line x1="80" y1="75" x2="95" y2="92"/>
    <line x1="120" y1="75" x2="105" y2="92"/>
    <line x1="120" y1="75" x2="135" y2="92"/>
  </g>
  
  <!-- Cursor -->
  <polygon points="125,85 125,98 129,94 133,100 135,99 131,93 137,93" fill="#1E293B"/>
  
  <!-- Checkmark badge -->
  <circle cx="145" cy="105" r="10" fill="#10B981"/>
  <polyline points="140,105 143,108 150,101" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
