<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150">
  <title>全过程通用分析</title>
  
  <!-- Background circle -->
  <circle cx="100" cy="75" r="65" fill="#EBF5FF"/>
  
  <!-- Simple cable-stayed bridge -->
  <g stroke="#2563EB" fill="none" stroke-linecap="round">
    <!-- Bridge deck -->
    <line x1="35" y1="95" x2="165" y2="95" stroke-width="4"/>
    
    <!-- Left tower -->
    <line x1="70" y1="95" x2="70" y2="50" stroke-width="3"/>
    
    <!-- Right tower -->
    <line x1="130" y1="95" x2="130" y2="50" stroke-width="3"/>
    
    <!-- Cables left -->
    <line x1="70" y1="55" x2="45" y2="90" stroke-width="1.5" opacity="0.7"/>
    <line x1="70" y1="55" x2="95" y2="90" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Cables right -->
    <line x1="130" y1="55" x2="105" y2="90" stroke-width="1.5" opacity="0.7"/>
    <line x1="130" y1="55" x2="155" y2="90" stroke-width="1.5" opacity="0.7"/>
  </g>
  
  <!-- Load arrows -->
  <g fill="#EF4444" stroke="#EF4444" stroke-width="1.5">
    <line x1="85" y1="70" x2="85" y2="85"/>
    <polygon points="85,88 82,82 88,82"/>
    
    <line x1="115" y1="70" x2="115" y2="85"/>
    <polygon points="115,88 112,82 118,82"/>
  </g>
  
  <!-- Analysis nodes -->
  <g fill="#10B981">
    <circle cx="55" cy="95" r="3"/>
    <circle cx="100" cy="95" r="3"/>
    <circle cx="145" cy="95" r="3"/>
  </g>
</svg>
