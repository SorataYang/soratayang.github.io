name: Build offline manual (.exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 推到 GitHub Release(仅 tag 触发时默认生效)
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows .exe
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Chinese .exe
        run: npm run tauri:build:zh

      - name: Stash zh binary
        shell: pwsh
        run: Move-Item src-tauri/target/release/qiaotong-manual.exe src-tauri/target/release/qiaotong-manual-zh.exe -Force

      - name: Build English .exe
        run: npm run tauri:build:en

      - name: Stash en binary
        shell: pwsh
        run: Move-Item src-tauri/target/release/qiaotong-manual.exe src-tauri/target/release/qiaotong-manual-en.exe -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-manual-exe
          if-no-files-found: error
          path: |
            src-tauri/target/release/qiaotong-manual-zh.exe
            src-tauri/target/release/qiaotong-manual-en.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/qiaotong-manual-zh.exe
            src-tauri/target/release/qiaotong-manual-en.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
